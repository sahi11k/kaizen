      <section class="card app__about">
        <div class="about__content">
          <h1 class="about__title">What is ZenTen?</h1>
          <div class="about__description">
            ZenTen is a modern adaptation of the Pomodoro Technique, designed to
            help you achieve your peak focus state - your perfect 10/10. Created
            by <strong>Francesco Cirillo</strong>, the underlying time
            management method breaks work into focused intervals, helping you
            maintain concentration while preventing mental fatigue. Each focused
            session is followed by a short break, allowing your mind to
            recharge. After completing four sessions, you take a longer break to
            fully refresh. This structured approach helps you maintain sustained
            productivity throughout your work or study sessions while keeping
            your mental clarity at its peak.
            <cite>
              — Adapted from
              <a
                href="https://en.wikipedia.org/wiki/Pomodoro_Technique"
                target="_blank"
                rel="noopener noreferrer"
                style="text-decoration: none; color: var(--white)"
                >Wikipedia</a
              >
            </cite>
          </div>
          <h1 class="about__title">How to use ZenTen?</h1>
          <ol class="about__list">
            <li>Add a task you want to focus on.</li>
            <li>Start your focus timer (25 minutes by default).</li>
            <li>Work on your task with complete concentration.</li>
            <li>
              When the timer rings, take a short break (5-10 minutes) to reset
              your mind.
            </li>
            <li>Repeat steps 2-4 until you complete four focus sessions.</li>
            <li>
              After four sessions, take a longer break (15-20 minutes) to fully
              recharge.
            </li>
            <li>
              Begin a new cycle when you're ready to achieve your next perfect
              10.
            </li>
          </ol>
        </div>
